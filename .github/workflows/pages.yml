name: Publicar Bora Viajar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código publicado
        uses: actions/checkout@v4
      - name: Preparar os arquivos públicos
        run: python build_public.py
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar o site público
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar a versão atual
        id: deployment
        uses: actions/deploy-pages@v4
